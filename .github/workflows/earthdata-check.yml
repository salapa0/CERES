name: Earthdata secret check
on:
  push:
    branches: [build/earthdata]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Secret present and accepted by GES DISC (value never printed)
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: |
          if [ -z "$EARTHDATA_TOKEN" ]; then echo "EARTHDATA_TOKEN is NOT set"; exit 1; fi
          echo "EARTHDATA_TOKEN is set (${#EARTHDATA_TOKEN} chars)"
          url='https://gpm1.gesdisc.eosdis.nasa.gov/opendap/GPM_L3/GPM_3IMERGDL.07/2026/11/3B-DAY-L.MS.MRG.3IMERG.20261101-S000000-E235959.V07C.nc4.dds'
          code=$(curl -s -L -o dds.txt -w '%{http_code}' -H "Authorization: Bearer $EARTHDATA_TOKEN" "$url")
          echo "GES DISC OPeNDAP .dds HTTP $code"; head -c 1500 dds.txt; echo
          asc='https://gpm1.gesdisc.eosdis.nasa.gov/opendap/GPM_L3/GPM_3IMERGDL.07/2026/11/3B-DAY-L.MS.MRG.3IMERG.20261101-S000000-E235959.V07C.nc4.ascii?precipitation%5B0:0%5D%5B2770:2772%5D%5B1055:1057%5D,lon%5B2770:2772%5D,lat%5B1055:1057%5D'
          code=$(curl -s -L -o asc.txt -w '%{http_code}' -H "Authorization: Bearer $EARTHDATA_TOKEN" "$asc")
          echo "ASCII subset HTTP $code"; head -c 1500 asc.txt; echo
