# Temporary: checks which request formats Giovanni (GLDAS) and NSIDC cloud OPeNDAP (SMAP) accept. Deleted before merge.
name: Earthdata probe
on:
  push:
    branches: [build/selfcheck-smap]
    paths: ['.github/workflows/earthdata-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
    steps:
      - name: Giovanni GLDAS point series
        run: |
          G='https://api.giovanni.earthdata.nasa.gov/timeseries?data=GLDAS_NOAH025_3H_2_1_RootMoist_inst&location=%5B16.375%2C102.625%5D'
          for h in authorizationtoken Bearer; do
            if [ $h = Bearer ]; then H="Authorization: Bearer $TOKEN"; else H="authorizationtoken: $TOKEN"; fi
            echo "== header $h, 2 days"
            curl -s -m 120 -o g.txt -w '%{http_code} %{size_download}B %{time_total}s\n' -H "$H" "$G&time=2024-11-01T00:00:00%2F2024-11-03T00:00:00"
            head -c 1200 g.txt; echo
          done
          echo "== 25 years, authorizationtoken"
          curl -s -m 300 -o y.txt -w '%{http_code} %{size_download}B %{time_total}s\n' -H "authorizationtoken: $TOKEN" "$G&time=2001-08-01T00:00:00%2F2026-07-31T21:00:00"
          head -c 600 y.txt; echo; tail -n 3 y.txt; wc -l y.txt
          echo "== 25 years, Bearer"
          curl -s -m 300 -o z.txt -w '%{http_code} %{size_download}B %{time_total}s\n' -H "Authorization: Bearer $TOKEN" "$G&time=2001-08-01T00:00:00%2F2026-07-31T21:00:00"
          head -c 300 z.txt; echo; wc -l z.txt
      - name: SMAP cloud OPeNDAP
        run: |
          S='https://opendap.earthdata.nasa.gov/collections/C3480440870-NSIDC_CPRD/granules/SMAP_L4_SM_gph_20261110T223000_Vv8013_001.h5_u9loH5HD'
          echo "== dmr"
          curl -s -L -m 120 -o d.txt -w '%{http_code} %{size_download}B\n' -H "Authorization: Bearer $TOKEN" "$S.dmr"
          grep -o 'name="[A-Za-z_]*"' d.txt | head -60 | tr '\n' ' '; echo
          echo "== dap2 ascii lat column"
          curl -s -L -m 120 -o a.txt -w '%{http_code} %{size_download}B\n' -H "Authorization: Bearer $TOKEN" "$S.ascii?cell_lat%5B0:200:1623%5D%5B0%5D,cell_lon%5B0%5D%5B0:400:3855%5D"
          head -c 1500 a.txt; echo
          echo "== dap4 csv"
          curl -s -L -m 120 -o c.txt -w '%{http_code} %{size_download}B\n' -H "Authorization: Bearer $TOKEN" "$S.dap.csv?dap4.ce=/cell_lat%5B0:200:1623%5D%5B0%5D"
          head -c 800 c.txt; echo
